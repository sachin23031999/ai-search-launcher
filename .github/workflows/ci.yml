name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & smoke test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build .NET MCP server (Debug)
        run: dotnet build mcp-server/McpServer.csproj -c Debug -f net8.0-windows --nologo

      - name: Compile Kotlin app
        run: .\gradlew.bat :app:compileKotlin --no-daemon --console=plain

      - name: MCP transport + tool discovery smoke test
        env:
          MCP_SERVER_PATH: ${{ github.workspace }}\mcp-server\bin\Debug\net8.0-windows\McpServer.exe
        run: .\gradlew.bat :app:mcpSmoke --no-daemon --console=plain
